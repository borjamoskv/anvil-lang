[package]
name = "anvil"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
description = "Anvil — A programming language where trust doesn't compile."
license = "MIT"
authors = ["BorjaMoskv"]
repository = "https://github.com/borjamoskv/anvil-lang"
homepage = "https://github.com/borjamoskv/anvil-lang"
keywords = ["formal-verification", "smart-contracts", "z3", "smt"]
categories = ["compilers", "development-tools"]

[[bin]]
name = "anvil"
path = "src/main.rs"

[dependencies]
# Parser
pest = "2.7"
pest_derive = "2.7"

# SMT Solver for formal verification
z3 = "0.12"

# CLI
clap = { version = "4", features = ["derive"] }

# Error reporting
miette = { version = "7", features = ["fancy"] }
thiserror = "2"

# Colored terminal output
colored = "2"

# Serialization (AST dump)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Language Server Protocol
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }

# SaaS Portal API
axum = "0.7"
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
chrono = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
uuid = { version = "1.23.1", features = ["v4"] }
