[package]
name = "anvil"
version = "0.5.0"
edition = "2024"
description = "Anvil — A programming language where trust doesn't compile."
license = "MIT"
authors = ["BorjaMoskv <borja@moskv.dev>"]

[[bin]]
name = "anvil"
path = "src/main.rs"

[dependencies]
# Parser
pest = "2.7"
pest_derive = "2.7"

# SMT Solver for formal verification
z3 = "0.12"

# CLI
clap = { version = "4", features = ["derive"] }

# Error reporting
miette = { version = "7", features = ["fancy"] }
thiserror = "2"

# Colored terminal output
colored = "2"

# Serialization (AST dump)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
