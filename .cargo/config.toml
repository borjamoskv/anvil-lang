[env]
Z3_SYS_Z3_HEADER = "/opt/homebrew/opt/z3/include/z3.h"
LIBRARY_PATH = "/opt/homebrew/opt/z3/lib"
LIBSQLITE3_SYS_USE_PKG_CONFIG = "1"
SQLITE3_LIB_DIR = "/opt/homebrew/opt/sqlite/lib"
SQLITE3_INCLUDE_DIR = "/opt/homebrew/opt/sqlite/include"

[build]
jobs = 1
target-dir = "target"

[target.aarch64-apple-darwin]
rustflags = ["-L", "/opt/homebrew/opt/z3/lib"]
