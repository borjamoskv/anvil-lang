name: Anvil CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Install Z3 Solver
      run: |
        sudo apt-get update
        sudo apt-get install -y z3 libz3-dev clang llvm
        z3 --version

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Check Formatting
      run: cargo fmt -- --check

    - name: Lint (Clippy)
      run: cargo clippy -- -D warnings

  build_and_test:
    name: Build & Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        rust: [stable, "1.85"]

    steps:
    - uses: actions/checkout@v4

    - name: Install Z3 Solver
      run: |
        sudo apt-get update
        sudo apt-get install -y z3 libz3-dev clang llvm
        z3 --version

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --verbose

    - name: Run Tests
      run: cargo test --verbose

    - name: Build Proof Market Oracle (Axum)
      working-directory: services/proof-market
      run: cargo build --verbose

    - name: Verify Hello World Example
      run: cargo run -- check examples/hello.anv

    - name: Verify Transfer Example
      run: cargo run -- check examples/transfer.anv

    - name: Generate Documentation
      run: cargo doc --no-deps

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build_and_test

    steps:
    - uses: actions/checkout@v4

    - name: Install Z3 Solver
      run: |
        sudo apt-get update
        sudo apt-get install -y z3 libz3-dev clang llvm

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Integration Test - Vault Proof Market
      run: python3 tests/test_proof_market.py

    - name: Integration Test - AMM Vulnerability Market
      run: python3 tests/test_proof_market_amm.py

    - name: Generate CORTEX Provenance Manifests
      run: |
        echo "  → Generating CORTEX provenance manifests for example programs..."
        mkdir -p artifacts/cortex
        for anv_file in examples/*.anv; do
          if [ -f "$anv_file" ]; then
            echo "  → Building $anv_file with provenance..."
            ./target/debug/anvil build "$anv_file" -o "artifacts/cortex/$(basename "$anv_file" .anv)" || true
          fi
        done
        echo "  ✓ Manifests generated:"
        ls -la artifacts/cortex/*.cortex_manifest.json 2>/dev/null || echo "  (no manifests generated)"

    - name: Upload CORTEX Provenance Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cortex-provenance-manifests
        path: artifacts/cortex/*.cortex_manifest.json
        if-no-files-found: ignore
        retention-days: 90

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run Security Audit
      run: cargo audit
