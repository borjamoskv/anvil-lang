name: Anvil CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 1
  RUST_TEST_THREADS: 1
  PYTHONDONTWRITEBYTECODE: 1
  RUSTFLAGS: -L /usr/lib/x86_64-linux-gnu
  CARGO_TARGET_DIR: target
  Z3_SYS_Z3_HEADER: /usr/include/z3.h
  LIBRARY_PATH: /usr/lib/x86_64-linux-gnu
  LIBSQLITE3_SYS_USE_PKG_CONFIG: "1"
  SQLITE3_LIB_DIR: /usr/lib/x86_64-linux-gnu
  SQLITE3_INCLUDE_DIR: /usr/include

jobs:
  quick:
    name: Quick Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install Z3 Solver
      run: |
        sudo apt-get update
        sudo apt-get install -y z3 libz3-dev clang llvm libsqlite3-dev
        z3 --version

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: quick

    - name: Check Formatting
      run: |
        cargo fmt -- --check
        cargo fmt --manifest-path services/proof-market/Cargo.toml -- --check

    - name: Check Root Crate
      run: cargo check --bin anvil --verbose

    - name: Check Proof Market Crate
      run: cargo check --manifest-path services/proof-market/Cargo.toml --verbose

    - name: Run Unit Tests
      run: cargo test --bin anvil --verbose -- --test-threads=1

    - name: Run Proof Market Unit Tests
      run: cargo test --manifest-path services/proof-market/Cargo.toml --verbose

  full:
    name: Full Checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quick

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install Z3 Solver
      run: |
        sudo apt-get update
        sudo apt-get install -y z3 libz3-dev clang llvm libsqlite3-dev
        z3 --version

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: full

    - name: Build Debug Binaries
      run: |
        cargo build --bin anvil --verbose
        cargo build --manifest-path services/proof-market/Cargo.toml --bin proof-market --verbose

    - name: Run Proof Market Unit Tests
      run: cargo test --manifest-path services/proof-market/Cargo.toml --verbose

    - name: Run Rust Integration Tests
      run: cargo test --test integration_tests --verbose -- --test-threads=1

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Python Proof Market - Vault
      run: python3 tests/test_proof_market.py
      env:
        ANVIL_BIN: ${{ env.CARGO_TARGET_DIR }}/debug/anvil
        PROOF_MARKET_BIN: ${{ env.CARGO_TARGET_DIR }}/debug/proof-market

    - name: Python Proof Market - AMM
      run: python3 tests/test_proof_market_amm.py
      env:
        ANVIL_BIN: ${{ env.CARGO_TARGET_DIR }}/debug/anvil
        PROOF_MARKET_BIN: ${{ env.CARGO_TARGET_DIR }}/debug/proof-market

    - name: Verify Hello World Example
      run: cargo run --bin anvil -- check examples/hello.anv

    - name: Verify Transfer Example
      run: cargo run --bin anvil -- check examples/transfer.anv

    - name: Release Build
      run: |
        cargo build --release --bin anvil --verbose
        cargo build --release --manifest-path services/proof-market/Cargo.toml --bin proof-market --verbose

    - name: Generate CORTEX Provenance Manifests
      run: |
        echo "  → Generating CORTEX provenance manifests for example programs..."
        mkdir -p artifacts/cortex
        for anv_file in examples/*.anv; do
          if [ -f "$anv_file" ]; then
            echo "  → Building $anv_file with provenance..."
            "$CARGO_TARGET_DIR/debug/anvil" build "$anv_file" -o "artifacts/cortex/$(basename "$anv_file" .anv)" || true
          fi
        done
        echo "  ✓ Manifests generated:"
        ls -la artifacts/cortex/*.cortex_manifest.json 2>/dev/null || echo "  (no manifests generated)"

    - name: Upload CORTEX Provenance Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cortex-provenance-manifests
        path: artifacts/cortex/*.cortex_manifest.json
        if-no-files-found: ignore
        retention-days: 90

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quick

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Generate Lockfiles
      run: |
        cargo generate-lockfile
        cargo generate-lockfile --manifest-path services/proof-market/Cargo.toml

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: Run Security Audit
      run: |
        cargo audit --file Cargo.lock
        cargo audit --file services/proof-market/Cargo.lock
