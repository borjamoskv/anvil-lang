name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  RUST_TEST_THREADS: 1
  PYTHONDONTWRITEBYTECODE: 1
  RUSTFLAGS: -L /usr/lib/x86_64-linux-gnu
  CARGO_TARGET_DIR: target
  Z3_SYS_Z3_HEADER: /usr/include/z3.h
  LIBRARY_PATH: /usr/lib/x86_64-linux-gnu
  LIBSQLITE3_SYS_USE_PKG_CONFIG: "1"
  SQLITE3_LIB_DIR: /usr/lib/x86_64-linux-gnu
  SQLITE3_INCLUDE_DIR: /usr/include

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install Z3 Solver
      run: |
        sudo apt-get update
        sudo apt-get install -y z3 libz3-dev clang llvm libsqlite3-dev

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Run Full Checks
      run: scripts/ci-full.sh

    - name: Upload Check Logs
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: release-check-logs
        path: cache/ci/

    - name: Extract Version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Extract Changelog
      id: changelog
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        # Extract section for this version from CHANGELOG.md
        NOTES=$(sed -n "/^## \[${VERSION#v}\]/,/^## \[/p" CHANGELOG.md | head -n -1 | tail -n +2)
        if [ -z "$NOTES" ]; then
          NOTES="Release ${VERSION}"
        fi
        echo "NOTES<<EOF" >> $GITHUB_OUTPUT
        echo "$NOTES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        body: ${{ steps.changelog.outputs.NOTES }}
        files: |
          ${{ env.CARGO_TARGET_DIR }}/release/anvil
        draft: false
        prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
