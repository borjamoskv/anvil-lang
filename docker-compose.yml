services:
  anvil:
    build: .
    container_name: anvil-saas
    ports:
      - "4242:4242"
    environment:
      RUST_LOG: info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4242/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
